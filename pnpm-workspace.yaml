packages:
  - '.'

autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sqlite3: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - got@11.8.5
  - ip-address@10.1.1
  - uuid@11.1.1
  - qs@6.15.2
  - brace-expansion@5.0.6
  - js-cookie@3.0.6
  - form-data@4.0.6
  - tar@7.5.16 || 7.5.21
  - '@babel/core@7.29.1'
  - js-yaml@3.15.0 || 4.1.2
  - browserslist@4.28.7
  - jsdom@30.1.3
  - http-cache-semantics@4.2.1
  - source-map-js@1.2.2
  - follow-redirects@1.16.1
  - vite@8.3.3
  - body-parser@2.4.0
  - undici@6.29.1 || 8.12.2
  - multer@2.5.0
  - node-forge@1.4.1

overrides:
  browserslist@<=4.28.6: ^4.28.7
  got@<11.8.5: ^11.8.5
  ip-address@<=10.1.0: ^10.1.1
  node-forge@<=1.4.0: ^1.4.1
  tar@<=7.5.15: ^7.5.16
  undici@>=6.23.0 <6.29.1: ^6.29.1
  undici@>=6.5.0 <6.29.1: ^6.29.1
  uuid@<11.1.1: ^11.1.1
